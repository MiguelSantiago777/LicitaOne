name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: http://localhost:14200
    steps:
      - uses: actions/checkout@v5
      - name: Sobe o sistema completo
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/screenshots
      - if: failure()
        run: docker compose logs --no-color > compose.log && tail -200 compose.log
