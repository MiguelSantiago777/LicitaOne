name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: http://localhost:14200
    steps:
      - uses: actions/checkout@v5
      - name: Sobe o sistema completo
        run: |
          cp .env.example .env
          echo "SHEMA_LOGIN_ATTEMPTS_PER_MINUTE=1000" >> .env
          # Leitura com IA sem chave e sem custo: leitor de demonstração (ADR 0016)
          echo "SHEMA_EXTRACTION_DEMO=true" >> .env
          docker compose up -d --build --wait
      # As imagens que sobem em produção: pacotes do Alpine e jars, não só os arquivos de dependência
      - name: Trivy na imagem do backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: shemacrm-backend
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy na imagem do frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: shemacrm-frontend
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/screenshots
      - if: failure()
        run: docker compose logs --no-color > compose.log && tail -200 compose.log
