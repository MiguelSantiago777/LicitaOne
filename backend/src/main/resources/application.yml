spring:
  application:
    name: shemacrm
  # Em dev, lê o .env da raiz do repositório (o mesmo do docker compose). No container ele não existe.
  config:
    import: optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:15432}/${POSTGRES_DB:shemacrm}}
    username: ${DB_USER:${POSTGRES_USER:shemacrm}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # db/seed traz dados de exemplo; o perfil prod tira essa pasta
    locations: classpath:db/migration,classpath:db/seed
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:15682}
    username: ${RABBITMQ_USER:shemacrm}
    password: ${RABBITMQ_PASSWORD:}
    # Confirmação do broker: o outbox só marca o evento como publicado depois do "ok" do RabbitMQ
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
  modulith:
    events:
      jdbc:
        # A tabela event_publication vem do Flyway (V6__outbox.sql)
        schema-initialization:
          enabled: false
      # Eventos que não chegaram ao fim (ex.: queda antes do RabbitMQ confirmar) são reenviados na subida
      republish-outstanding-events-on-restart: true
  # Aviso interno dos alertas (ADR 0006). Em dev, o Mailpit do compose; desligue com SHEMA_ALERTS_MAIL_ENABLED=false.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:${MAILPIT_SMTP_PORT:11025}}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Documentos (atas, contratos) de até 25 MB; o limite de cada tipo de arquivo é checado no serviço
      max-file-size: 25MB
      max-request-size: 26MB

server:
  # Local: a porta do .env (BACKEND_PORT); no container não há .env e fica 8080
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native

management:
  server:
    # Porta separada, não exposta para fora do compose
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

shema:
  storage:
    # Planilhas, relatórios e documentos (FileStorage): local (pasta) ou s3 (ADR 0007). O compose usa s3.
    type: ${SHEMA_STORAGE_TYPE:local}
    local-dir: ${SHEMA_STORAGE_DIR:./data/files}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:shemacrm-files}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  # Alertas da seção 5.4 (ADR 0015). O prazo da licitação vencida sem contrato ("X dias") precisa de validação do
  # cliente; os outros vêm da especificação.
  alerts:
    cron: ${SHEMA_ALERTS_CRON:0 0 7 * * *}
    contract-without-order-days: ${SHEMA_ALERTS_CONTRACT_WITHOUT_ORDER_DAYS:30}
    price-record-expiring-days: ${SHEMA_ALERTS_PRICE_RECORD_EXPIRING_DAYS:90,60,30}
    tender-without-contract-days: ${SHEMA_ALERTS_TENDER_WITHOUT_CONTRACT_DAYS:30}
    app-url: ${SHEMA_APP_URL:http://localhost:${FRONTEND_PORT:14200}}
    mail-from: ${SHEMA_ALERTS_MAIL_FROM:LicitaOne <alertas@shema.local>}
    mail-enabled: ${SHEMA_ALERTS_MAIL_ENABLED:true}
  # Leitura de atas e contratos com IA (Fase 7, ADR 0016). Sem chave, a funcionalidade fica desligada.
  # SHEMA_AI_PROVIDER escolhe o provedor (ADR 0021): claude (ANTHROPIC_API_KEY) ou gemini (GEMINI_API_KEY).
  extraction:
    provider: ${SHEMA_AI_PROVIDER:claude}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${SHEMA_EXTRACTION_GEMINI_MODEL:gemini-3.8-flash}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${SHEMA_EXTRACTION_MODEL:claude-opus-5-5}
    effort: ${SHEMA_EXTRACTION_EFFORT:medium}
    fallbacks: ${SHEMA_EXTRACTION_FALLBACKS:true}
    # Só para E2E: leitor de demonstração, sem IA. Nunca em produção.
    demo: ${SHEMA_EXTRACTION_DEMO:false}
  # "Pergunte ao LicitaOne" (Fase 11, ADR 0020): mesmo provedor e mesma chave da leitura; sem ela, o botão some.
  assistant:
    provider: ${SHEMA_AI_PROVIDER:claude}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${SHEMA_ASSISTANT_GEMINI_MODEL:gemini-3.8-flash}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${SHEMA_ASSISTANT_MODEL:claude-opus-5-5}
    daily-limit: ${SHEMA_ASSISTANT_DAILY_LIMIT:50}
    # Só para E2E: responde por palavra-chave, sem IA. Nunca em produção.
    demo: ${SHEMA_EXTRACTION_DEMO:false}
  # Dados da empresa no cabeçalho e na anuência do kit de carona (Fase 10). Em branco, o texto mostra o campo entre
  # colchetes para preencher, e a tela avisa.
  company:
    legal-name: ${SHEMA_COMPANY_LEGAL_NAME:Shema Suprimentos e Serviços}
    cnpj: ${SHEMA_COMPANY_CNPJ:}
    address: ${SHEMA_COMPANY_ADDRESS:}
    city: ${SHEMA_COMPANY_CITY:}
    representative: ${SHEMA_COMPANY_REPRESENTATIVE:}
    representative-role: ${SHEMA_COMPANY_REPRESENTATIVE_ROLE:}
    email: ${SHEMA_COMPANY_EMAIL:}
    phone: ${SHEMA_COMPANY_PHONE:}
  auth:
    secure-cookie: false
    cors-origins: ${SHEMA_CORS_ORIGINS:http://localhost:4300}
  jwt:
    private-key: ${SHEMA_JWT_PRIVATE_KEY:}
    key-id: ${SHEMA_JWT_KEY_ID:dev-1}
  bootstrap-admin:
    email: ${SHEMA_ADMIN_EMAIL:}
    password: ${SHEMA_ADMIN_PASSWORD:}
    name: ${SHEMA_ADMIN_NAME:Administrador}
