spring:
  flyway:
    locations: classpath:db/migration

logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

shema:
  auth:
    secure-cookie: true
  jwt:
    # Sem SHEMA_JWT_PRIVATE_KEY o backend não sobe (ASVS V6: segredo de produção nunca gerado na hora)
    require-key: true
