# LicitaOne atrás do Apache do servidor (quando o Apache já ocupa as portas 80 e 443).
# 1. Troque licitaone.exemplo.com.br pelo seu domínio (o mesmo de SHEMA_PUBLIC_URL) e a porta, se mudou FRONTEND_PORT.
# 2. sudo cp deploy/apache/licitaone.conf /etc/apache2/sites-available/
#    sudo a2enmod proxy proxy_http headers
#    sudo a2ensite licitaone && sudo apache2ctl configtest && sudo systemctl reload apache2
# 3. HTTPS: sudo certbot --apache -d licitaone.exemplo.com.br
#    O certbot cria o site na 443 (licitaone-le-ssl.conf) com estas mesmas linhas e redireciona o HTTP para HTTPS.
<VirtualHost *:80>
    ServerName licitaone.exemplo.com.br

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:14200/
    ProxyPassReverse / http://127.0.0.1:14200/
    # Leitura de documentos com IA e relatórios podem demorar
    ProxyTimeout 300
    # Uploads de até 25 MB (o backend recusa acima disso)
    LimitRequestBody 27262976

    ErrorLog ${APACHE_LOG_DIR}/licitaone-error.log
    CustomLog ${APACHE_LOG_DIR}/licitaone-access.log combined
</VirtualHost>
