server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  location /api/ {
    # Front e API saem pela mesma origem (este nginx). O backend não vê a porta do navegador e trataria
    # "http://127.0.0.1:14200" ou um IP da rede como outra origem (403 de CORS). Quando o Origin é o próprio
    # endereço da página, ele é removido; origens de fora continuam barradas pelo CORS do backend.
    set $origin_to_backend $http_origin;
    if ($http_origin = "$scheme://$http_host") {
      set $origin_to_backend "";
    }
    proxy_set_header Origin $origin_to_backend;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
  }

  # Arquivos com hash no nome: cache longo. index.html: sempre revalidar.
  location ~* \.(js|css|woff2?|svg|png)$ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
